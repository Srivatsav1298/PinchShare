[package]
name = "pinchshare-core"
version = "0.1.0"
license.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8.9"
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"] }
dirs = "7.0.0"
getrandom = { version = "0.4.3", features = ["std"] }
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
mdns-sd = "0.21.7"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
spake2 = "0.4.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1.44"
zip = { version = "9.5.0", default-features = false }

[dev-dependencies]
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
